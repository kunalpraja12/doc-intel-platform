services:
  api:
    build: .
    container_name: docintel-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    command: sh -c "alembic -c db/alembic.ini upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000} --reload"

  postgres:
    image: postgres:16
    container_name: docintel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docintel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
